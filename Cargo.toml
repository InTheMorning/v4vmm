[package]
name = "v4vmm"
version = "0.1.0"
edition = "2021"

[dependencies]
toml  = "1.0"
id3 = "1"
lofty = "0.22"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rss = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde_json = "1"

# config parsing
serde = { version = "1", features = ["derive"] }
directories = "6"

# nice error handling
anyhow = "1"

# GPUI desktop UI
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
open = "5"

# media cache
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
lru = "0.12"

# Async view-model runtime (ADR 0040). Behind a feature gate during the
# Phase D bring-up so master-style synchronous CommandBus paths continue
# to work without tokio runtime startup costs in CLI / tests.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }

[features]
default = ["async-runtime"]
async-runtime = ["dep:tokio", "dep:tokio-util"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "v4vmm"
path = "src/main.rs"
