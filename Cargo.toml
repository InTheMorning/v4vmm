[package]
name = "v4vmm"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
toml  = "1.0"
id3 = "1"
lofty = "0.22"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rss = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde_json = "1"

# config parsing
serde = { version = "1", features = ["derive"] }
directories = "6"

# nice error handling
anyhow = "1"

# GPUI desktop UI
gpui = { package = "gpui-pre", version = "=0.3.1" }
gpui-component = "=0.6.1"
gpui-base = "=0.6.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.1", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-kit-assets = "=0.6.1"
open = "5"

# media cache
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
lru = "0.12"

# Async view-model runtime (ADR 0040).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.1", features = ["test-support"] }
tempfile = "3"

# ADR 0072: final-glyph hit testing and complete grapheme word selection only.
[patch.crates-io]
gpui-base = { git = "https://github.com/InTheMorning/gpui-kit", rev = "5463fe4e72fd740b0db08da92003488b32661867" }

[[bin]]
name = "v4vmm"
path = "src/main.rs"

# ADR 0066 task 003: font parsing/shaping stalls debug Settings layout.
# Optimize the text stack, including its generic callers. Keep the app itself
# unoptimized with debug assertions and symbols for operator recovery fixtures.
[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

# ADR 0071: the native resize CPU capture identifies repeated layout work.
# Taffy's generic layout algorithms are instantiated by GPUI; optimize both
# dependencies while keeping application debugging and dependency pins intact.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3
