[package]
name = "v4vmm"
version = "0.1.0"
edition = "2021"

[dependencies]
toml  = "1.0"
id3 = "1"
lofty = "0.22"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rss = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"

# config parsing
serde = { version = "1", features = ["derive"] }
directories = "6"

# nice error handling
anyhow = "1"

# GPUI desktop UI
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
open = "5"

# media cache
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
lru = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "v4vmm"
path = "src/main.rs"
